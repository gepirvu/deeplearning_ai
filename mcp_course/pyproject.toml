[project]
name = "mcp-course"
version = "0.1.0"
description = "MCP Course Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.1.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "gradio>=4.0.0",
    "mcp>=1.0.0",
    "nest-asyncio>=1.6.0",
    "openai>=1.0.0",
]


[project.optional-dependencies]
# MCP server dependencies
server = [
    "mcp>=1.0.0",
    "arxiv>=2.1.0",
]

# Client/testing dependencies
client = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
]

# UI dependencies
ui = [
    "gradio>=4.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

#All dependencies for development
all = [
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "gradio>=4.0.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "openai>=1.0.0",
]

[project.scripts]
# Entry points for different components
